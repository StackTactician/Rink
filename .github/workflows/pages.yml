name: pages

# Publishes nkiri/web/static to GitHub Pages. No build step: the directory is
# the whole frontend. Routing is hash-based (#/g/..., #/s/...), so Pages needs
# no rewrite rules and no 404.html fallback.
#
# The page talks to the Render API cross-origin; config.js resolves that from
# location.hostname, and the server sends Access-Control-Allow-Origin: *.

on:
  push:
    branches: [main]
    paths:
      - "nkiri/web/static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nkiri/web/static

      - id: deployment
        uses: actions/deploy-pages@v4
