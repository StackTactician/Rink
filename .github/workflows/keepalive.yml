name: keepalive

# Render free web services spin down after ~15 minutes without traffic.
# This pokes the API on a cron so the instance stays warm.
#
# Caveats that make this a weak guarantee:
#   - GitHub's shortest schedule interval is 5 minutes, and scheduled runs are
#     delayed during high load (especially at the top of the hour). A */5 run
#     can still land late, so the job retries rather than trusting one tick.
#   - Actions minutes are free and unmetered on public repos, so */5 costs
#     nothing. On a private repo this would be ~8,600 minutes/month against
#     the 2,000 included with GitHub Free.
#   - This pings /api/formats, not /, so a 200 proves the whole stack works.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ping rink
        run: |
          url="https://rink.onrender.com/api/formats"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$url")
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "render did not answer 200 within 3 attempts"
          exit 1
